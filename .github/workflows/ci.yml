name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # macOS is a real check, not decoration: the daemon relies on Setsid and
    # Flock, and there are no build tags to hide a break behind.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race
