id = "muster"
name = "Muster"
version = "0.1.0"
# The floor Muster is tested against, not the lowest version that works: 0.8.0
# and 0.8.1 were never tried. See docs/herdr-api-notes.md.
min_herdr_version = "0.8.2"
description = "One screen for every agent across every repo"
platforms = ["linux", "macos"]

# Commands resolve through PATH, not the plugin root, so the leading ./ matters.
# See docs/herdr-api-notes.md.

[[build]]
command = ["go", "build", "-o", "./bin/muster", "./cmd/muster"]

[[build]]
command = ["go", "build", "-o", "./bin/musterd", "./cmd/musterd"]

# Must detach and return. A command that never exits sits in herdr's plugin
# command table as permanently running.
#
# `install --auto` rather than `musterd --ensure`: it starts the daemon the same
# way, then binds the keys, so installing the plugin is the whole setup. --auto
# is what makes that safe to repeat, since it leaves the keys alone once you
# have removed them.
[[startup]]
command = ["./bin/muster", "install", "--auto"]

# A popup, not an overlay. An overlay is a real split in the tab you open it
# from, zoomed, and on exit herdr restores the focus and zoom it saved at open
# time, so a jump into that same tab left it zoomed. A popup belongs to no tab,
# so there is nothing to restore, and herdr allows one per session, so a second
# Muster cannot open behind the first. See "Popup panes" in
# docs/herdr-api-notes.md.
[[panes]]
id = "home"
title = "Muster"
placement = "popup"
width = "100%"
height = "100%"
command = ["./bin/muster"]

[[actions]]
id = "open"
title = "Open Muster"
description = "Open the overlay, with one tile per agent and one per workspace that has none."
contexts = ["global"]
command = ["./bin/muster", "open"]

[[actions]]
id = "jump-orchestrator"
title = "Jump to orchestrator"
description = "Focus the pane marked as the orchestrator, from wherever you are."
contexts = ["global"]
command = ["./bin/muster", "jump", "orchestrator"]

[[actions]]
id = "back"
title = "Back to previous agent"
description = "Return to the pane you were in before the last jump."
contexts = ["global"]
command = ["./bin/muster", "jump", "previous"]

[[actions]]
id = "mark-orchestrator"
title = "Mark this agent as the orchestrator"
description = "Record this pane as the orchestrator, so jumps and reports land here."
contexts = ["pane"]
command = ["./bin/muster", "mark-orchestrator"]

[[actions]]
id = "install"
title = "Install Muster's keybindings"
description = "Bind the three Muster keys in your herdr config, back the config up first, and start the daemon."
contexts = ["global"]
command = ["./bin/muster", "install"]

# Separate from install on purpose. Keybindings go in herdr's config, which is
# Muster's business. A skill goes in the user's agent directories, which are
# not, so installing it stays something they ask for.
[[actions]]
id = "install-skill"
title = "Install the reporting skill for the orchestrator"
description = "Write muster-report to ~/.agents/skills and link it into every agent runtime that keeps a skills directory, so agents report a task line instead of a terminal title."
contexts = ["global"]
command = ["./bin/muster", "install-skill"]

# The only way to drop the keys and keep the overlay. `plugin install` puts the
# binaries in herdr's own checkout rather than on PATH, so without an action of
# its own this is a command the README could name and nobody could run.
[[actions]]
id = "uninstall-keys"
title = "Remove Muster's keybindings, keep the overlay"
description = "Take the three Muster keys back out of your herdr config and remember the refusal, so the startup hook stops rebinding them. Muster stays installed and openable from this menu."
contexts = ["global"]
command = ["./bin/muster", "uninstall-keys"]

# herdr has no uninstall hook: `plugin unlink` leaves files alone and plugins
# clean up after themselves. Without this action, unlinking Muster strands three
# keybindings pointing at a plugin that is gone.
[[actions]]
id = "uninstall"
title = "Uninstall Muster's keybindings and skill"
description = "Remove Muster's config block and the reporting skill. Run before unlinking the plugin."
contexts = ["global"]
command = ["./bin/muster", "uninstall"]

# --yes because actions run without a terminal to ask in. That is safe: the only
# fixes stop and start musterd, never a file. In a terminal `muster doctor` asks.
[[actions]]
id = "doctor"
title = "Check Muster's health"
description = "Diagnose the daemon and snapshot, restart a stranded or stuck daemon, and say how to fix the rest."
contexts = ["global"]
command = ["./bin/muster", "doctor", "--yes"]

# Rare events only. Status and output events are far too chatty for a
# process-per-event hook; musterd subscribes to those over the socket.
[[events]]
on = "workspace.created"
command = ["./bin/muster", "discover"]

[[events]]
on = "worktree.created"
command = ["./bin/muster", "discover"]
